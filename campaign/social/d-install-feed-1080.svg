<text x="113.061" y="108" font-family="Cinzel" font-size="23" fill="#f2f3f5" letter-spacing="2.76">AKADIAN</text>
<text x="250.831" y="108" font-family="Cinzel" font-size="13.8" fill="#f0a04a" letter-spacing="9.2">VERTEX</text>
<text x="78" y="218" font-family="Cinzel" font-size="72" fill="#f2f3f5" letter-spacing="2.88">NO APP STORE.</text>
<text x="78" y="295.76" font-family="Cinzel" font-size="72" fill="#f2f3f5" letter-spacing="2.88">JUST ADD IT.</text>
<text x="78" y="357.76" font-family="Sans" font-size="23" fill="#9aa0aa">Vertex is a web page, not a download. Open the link,</text>
<text x="78" y="391.34" font-family="Sans" font-size="23" fill="#9aa0aa">add it to your home screen, and it opens full-screen</text>
<text x="78" y="424.92" font-family="Sans" font-size="23" fill="#9aa0aa">like any other app.</text>
<circle cx="97.32" cy="491.78" r="19.32" fill="#f0a04a"/>
<text x="97.32" y="498.92" font-family="Sans-Black" font-size="22.05" fill="#15171c" text-anchor="middle">1</text>
<text x="134.028" y="492.62" font-family="Sans-Bold" font-size="21.42" fill="#f2f3f5">Open the link</text>
<text x="134.028" y="518.87" font-family="Sans" font-size="18.9" fill="#9aa0aa">Scan the code, or type the address into your phone's</text>
<text x="134.028" y="544.196" font-family="Sans" font-size="18.9" fill="#9aa0aa">browser.</text>
<circle cx="97.32" cy="561.78" r="19.32" fill="#f0a04a"/>
<text x="97.32" y="568.92" font-family="Sans-Black" font-size="22.05" fill="#15171c" text-anchor="middle">2</text>
<text x="134.028" y="562.62" font-family="Sans-Bold" font-size="21.42" fill="#f2f3f5">Add to Home Screen</text>
<text x="134.028" y="588.87" font-family="Sans" font-size="18.9" fill="#9aa0aa">In Safari, tap Share. In Chrome, tap the three dots.</text>
<circle cx="97.32" cy="631.78" r="19.32" fill="#f0a04a"/>
<text x="97.32" y="638.92" font-family="Sans-Black" font-size="22.05" fill="#15171c" text-anchor="middle">3</text>
<text x="134.028" y="632.62" font-family="Sans-Bold" font-size="21.42" fill="#f2f3f5">Open it like an app</text>
<text x="134.028" y="658.87" font-family="Sans" font-size="18.9" fill="#9aa0aa">Full-screen, no browser bar, and it still works on bad</text>
<text x="134.028" y="684.196" font-family="Sans" font-size="18.9" fill="#9aa0aa">wi-fi.</text>
