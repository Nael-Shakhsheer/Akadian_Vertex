<text x="86" y="500" font-family="Cinzel" font-size="96" fill="#15171c" letter-spacing="3.84">WHERE IS A FREE</text>
<text x="86" y="605.6" font-family="Cinzel" font-size="96" fill="#15171c" letter-spacing="3.84">STUDY ROOM?</text>
<text x="86" y="689.6" font-family="Sans" font-size="26" fill="#596070">The Johnson Center has 23 group study rooms across three floors. Vertex</text>
<text x="86" y="727.56" font-family="Sans" font-size="26" fill="#596070">knows where every one of them is, and walks you to the door.</text>
