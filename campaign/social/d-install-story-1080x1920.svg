<text x="86" y="480" font-family="Cinzel" font-size="104" fill="#f2f3f5" letter-spacing="4.16">NO APP STORE.</text>
<text x="86" y="592.32" font-family="Cinzel" font-size="104" fill="#f2f3f5" letter-spacing="4.16">JUST ADD IT.</text>
<text x="86" y="670.32" font-family="Sans" font-size="26" fill="#9aa0aa">Vertex is a website that works like an app. Add it to your home screen before</text>
