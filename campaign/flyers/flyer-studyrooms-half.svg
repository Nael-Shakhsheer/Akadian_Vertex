<text x="120.173" y="48" font-family="Cinzel" font-size="7.2" fill="#f0a04a" letter-spacing="4.8">VERTEX</text>
<text x="582" y="48" font-family="Sans-Bold" font-size="7.2" fill="#9aa0aa" letter-spacing="1.296" text-anchor="end">23 GROUP STUDY ROOMS · JOHNSON CENTER</text>
<text x="30" y="100" font-family="Cinzel" font-size="30" fill="#f2f3f5" letter-spacing="1.2">WHERE IS A FREE</text>
<text x="30" y="133" font-family="Cinzel" font-size="30" fill="#f2f3f5" letter-spacing="1.2">STUDY ROOM?</text>
<text x="30" y="160" font-family="Sans" font-size="8.8" fill="#9aa0aa">The Johnson Center has 23 group study rooms across three floors. Vertex</text>
<text x="30" y="172.672" font-family="Sans" font-size="8.8" fill="#9aa0aa">knows where every one of them is, and walks you to the door.</text>
<polygon points="33.06,204.24 36.12,207.3 33.06,210.36 30,207.3" fill="#f0a04a"/>
<text x="42.15" y="210" font-family="Sans-Bold" font-size="9" fill="#f2f3f5">Room-level indoors</text>
<text x="42.15" y="221.7" font-family="Sans" font-size="8.1" fill="#9aa0aa">Johnson Center, Research Hall, Merten Hall, The HUB.</text>
<polygon points="33.06,232.794 36.12,235.854 33.06,238.914 30,235.854" fill="#f0a04a"/>
<text x="42.15" y="238.554" font-family="Sans-Bold" font-size="9" fill="#f2f3f5">Works on bad wi-fi</text>
<text x="42.15" y="250.254" font-family="Sans" font-size="8.1" fill="#9aa0aa">A map you have opened stays on your phone.</text>
<polygon points="33.06,261.348 36.12,264.408 33.06,267.468 30,264.408" fill="#f0a04a"/>
<text x="42.15" y="267.108" font-family="Sans-Bold" font-size="9" fill="#f2f3f5">Nothing to install</text>
<text x="42.15" y="278.808" font-family="Sans" font-size="8.1" fill="#9aa0aa">No app store, no account. Add it to your home screen.</text>
