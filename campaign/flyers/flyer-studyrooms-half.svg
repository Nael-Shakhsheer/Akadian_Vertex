<text x="94" y="316" font-family="Sans" font-size="8.4" fill="#9aa0aa">No app store. No account. No download. Vertex is a web page</text>
<text x="94" y="327.76" font-family="Sans" font-size="8.4" fill="#9aa0aa">you add to your home screen.</text>
