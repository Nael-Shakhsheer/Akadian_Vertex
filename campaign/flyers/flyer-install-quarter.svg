<text x="38.006" y="46" font-family="Cinzel" font-size="10.5" fill="#f2f3f5" letter-spacing="1.26">AKADIAN</text>
<text x="100.901" y="46" font-family="Cinzel" font-size="6.3" fill="#f0a04a" letter-spacing="4.2">VERTEX</text>
<text x="22" y="92" font-family="Cinzel" font-size="26" fill="#f2f3f5" letter-spacing="1.04">NO APP STORE.</text>
<text x="22" y="120.6" font-family="Cinzel" font-size="26" fill="#f2f3f5" letter-spacing="1.04">JUST ADD IT.</text>
<text x="22" y="146.6" font-family="Sans" font-size="8.4" fill="#9aa0aa">Vertex is a website that works like an app. Add it to your home screen</text>
<text x="22" y="158.528" font-family="Sans" font-size="8.4" fill="#9aa0aa">before your first class: no download, no account, and it opens</text>
<text x="22" y="170.456" font-family="Sans" font-size="8.4" fill="#9aa0aa">full-screen.</text>
<circle cx="29.728" cy="203.6" r="7.728" fill="#f0a04a"/>
<text x="29.728" y="206.456" font-family="Sans-Black" font-size="8.82" fill="#15171c" text-anchor="middle">1</text>
<text x="44.411" y="203.936" font-family="Sans-Bold" font-size="8.568" fill="#f2f3f5">Open the link</text>
<text x="44.411" y="214.436" font-family="Sans" font-size="7.56" fill="#9aa0aa">Scan the code, or type the address into your phone's browser.</text>
<circle cx="29.728" cy="230.6" r="7.728" fill="#f0a04a"/>
<text x="29.728" y="233.456" font-family="Sans-Black" font-size="8.82" fill="#15171c" text-anchor="middle">2</text>
<text x="44.411" y="230.936" font-family="Sans-Bold" font-size="8.568" fill="#f2f3f5">Add to Home Screen</text>
<text x="44.411" y="241.436" font-family="Sans" font-size="7.56" fill="#9aa0aa">In Safari, tap Share. In Chrome, tap the three dots.</text>
<circle cx="29.728" cy="257.6" r="7.728" fill="#f0a04a"/>
<text x="29.728" y="260.456" font-family="Sans-Black" font-size="8.82" fill="#15171c" text-anchor="middle">3</text>
<text x="44.411" y="257.936" font-family="Sans-Bold" font-size="8.568" fill="#f2f3f5">Open it like an app</text>
<text x="44.411" y="268.436" font-family="Sans" font-size="7.56" fill="#9aa0aa">Full-screen, no browser bar, and it still works on bad wi-fi.</text>
