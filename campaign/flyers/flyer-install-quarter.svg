<text x="50" y="306.789" font-family="Sans-Black" font-size="7.242" fill="#d7d8d8" letter-spacing="1.906" text-anchor="middle">QR</text>
<text x="50" y="313.296" font-family="Sans-Bold" font-size="3.506" fill="#d7d8d8" letter-spacing="0.838" text-anchor="middle">PLACEHOLDER</text>
<text x="50" y="341.24" font-family="Sans-Bold" font-size="6.272" fill="#f2f3f5" text-anchor="middle">Scan to open</text>
<text x="92" y="290" font-family="Sans" font-size="8.6" fill="#f2f3f5">GPS gets you to the building. Vertex gets you to</text>
<text x="92" y="301.868" font-family="Sans" font-size="8.6" fill="#f2f3f5">the room.</text>
<line x1="22" y1="347.3" x2="284" y2="347.3" stroke="#46484d" stroke-width="0.75" stroke-linecap="butt"/>
<text x="22" y="361.8" font-family="Sans" font-size="5.8" fill="#9aa0aa">An independent student project. Not affiliated with, endorsed or sponsored by George Mason</text>
<text x="22" y="369.34" font-family="Sans" font-size="5.8" fill="#9aa0aa">University.</text>
