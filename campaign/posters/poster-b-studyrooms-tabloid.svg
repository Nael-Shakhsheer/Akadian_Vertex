<text x="60" y="1058.2" font-family="Sans-Bold" font-size="12.72" fill="#15171c">Room-level indoors</text>
<text x="60" y="1075" font-family="Sans" font-size="11.16" fill="#596070">Four buildings mapped floor</text>
<text x="60" y="1090.401" font-family="Sans" font-size="11.16" fill="#596070">by floor: the Johnson Center,</text>
<text x="60" y="1105.802" font-family="Sans" font-size="11.16" fill="#596070">Research Hall, Merten Hall</text>
<text x="60" y="1121.202" font-family="Sans" font-size="11.16" fill="#596070">and The HUB.</text>
<line x1="246.667" y1="1036" x2="270.667" y2="1036" stroke="#d2600a" stroke-width="2.4" stroke-linecap="butt"/>
<text x="246.667" y="1058.2" font-family="Sans-Bold" font-size="12.72" fill="#15171c">Works on bad wi-fi</text>
<text x="246.667" y="1075" font-family="Sans" font-size="11.16" fill="#596070">A map you have opened</text>
<text x="246.667" y="1090.401" font-family="Sans" font-size="11.16" fill="#596070">stays on your phone, so a</text>
<text x="246.667" y="1105.802" font-family="Sans" font-size="11.16" fill="#596070">dead spot in a stairwell does</text>
<text x="246.667" y="1121.202" font-family="Sans" font-size="11.16" fill="#596070">not strand you.</text>
<line x1="433.333" y1="1036" x2="457.333" y2="1036" stroke="#d2600a" stroke-width="2.4" stroke-linecap="butt"/>
<text x="433.333" y="1058.2" font-family="Sans-Bold" font-size="12.72" fill="#15171c">Nothing to install</text>
<text x="433.333" y="1075" font-family="Sans" font-size="11.16" fill="#596070">No app store and no</text>
<text x="433.333" y="1090.401" font-family="Sans" font-size="11.16" fill="#596070">account. Open the link and</text>
<text x="433.333" y="1105.802" font-family="Sans" font-size="11.16" fill="#596070">add it to your home screen.</text>
