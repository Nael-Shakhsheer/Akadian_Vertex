<text x="90.488" y="92" font-family="Cinzel" font-size="20" fill="#15171c" letter-spacing="2.4">AKADIAN</text>
<text x="210.288" y="92" font-family="Cinzel" font-size="12" fill="#d2600a" letter-spacing="8">VERTEX</text>
<text x="732" y="92" font-family="Sans-Bold" font-size="10.5" fill="#596070" letter-spacing="1.89" text-anchor="end">23 GROUP STUDY ROOMS · JOHNSON CENTER</text>
<text x="60" y="240" font-family="Cinzel" font-size="72.5" fill="#15171c" letter-spacing="2.9">WHERE IS A FREE</text>
<text x="60" y="318.3" font-family="Cinzel" font-size="72.5" fill="#15171c" letter-spacing="2.9">STUDY ROOM?</text>
<text x="60" y="352" font-family="Sans" font-size="16.5" fill="#596070">The Johnson Center has 23 group study rooms across three floors. Vertex knows where</text>
<text x="60" y="376.09" font-family="Sans" font-size="16.5" fill="#596070">every one of them is, and walks you to the door.</text>
<text x="60" y="414" font-family="Sans" font-size="12" fill="#596070">Every group study room in the building, by its real number. The one in orange is on the third floor.</text>
<text x="60" y="466" font-family="Sans-Bold" font-size="17.16" fill="#596070" letter-spacing="2.746">FLOOR 1 · 3 ROOMS</text>
