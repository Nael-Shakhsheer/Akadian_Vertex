<text x="68.866" y="68" font-family="Cinzel" font-size="15" fill="#15171c" letter-spacing="1.8">AKADIAN</text>
<text x="158.716" y="68" font-family="Cinzel" font-size="9" fill="#d2600a" letter-spacing="6">VERTEX</text>
<text x="566" y="68" font-family="Sans-Bold" font-size="8.2" fill="#596070" letter-spacing="1.476" text-anchor="end">23 GROUP STUDY ROOMS · JOHNSON CENTER</text>
<text x="46" y="158" font-family="Cinzel" font-size="54" fill="#15171c" letter-spacing="2.16">WHERE IS A FREE</text>
<text x="46" y="216.32" font-family="Cinzel" font-size="54" fill="#15171c" letter-spacing="2.16">STUDY ROOM?</text>
<text x="46" y="240" font-family="Sans" font-size="11.4" fill="#596070">The Johnson Center has 23 group study rooms across three floors. Vertex knows where</text>
<text x="46" y="256.644" font-family="Sans" font-size="11.4" fill="#596070">every one of them is, and walks you to the door.</text>
<text x="46" y="286" font-family="Sans" font-size="9.2" fill="#596070">Every group study room in the building, by its real number. The one in orange is on the third floor.</text>
<text x="46" y="320" font-family="Sans-Bold" font-size="11.7" fill="#596070" letter-spacing="1.872">FLOOR 1 · 3 ROOMS</text>
